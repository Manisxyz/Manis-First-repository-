<title>Pocket Plumber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: canvas stage on top, two thumb zones under it (portrait); zones hide in short landscape.
   A game keeps one dark look on purpose, so there are no light-theme tokens. */
:root {
  --ink: #0f1220;
  --panel: #191e35;
  --line: #2b3357;
  --text: #e8ebff;
  --dim: #8c95c2;
  --hot: #ff6a3d;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 500 14px/1.3 "DM Sans", system-ui, sans-serif;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 8px;
  box-sizing: border-box;
  touch-action: none;
}
#stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#c {
  image-rendering: pixelated;
  border-radius: 6px;
  background: #6ab4f5;
  display: block;
}
#pad {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  height: clamp(110px, 24vh, 170px);
}
.zone {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-width: 0;
  transition: border-color .1s, background .1s;
}
.zone.on { border-color: var(--hot); background: #241f35; }
.zone p { margin: 0; color: var(--dim); font-size: 13px; text-align: center; padding: 0 8px; }
.track {
  position: relative;
  width: min(80%, 190px);
  height: 44px;
  border-radius: 22px;
  background: #11152a;
  border: 1px solid var(--line);
}
.track::before, .track::after {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-size: 16px;
}
.track::before { content: "\25C0"; left: 14px; }
.track::after { content: "\25B6"; right: 14px; }
.thumb {
  position: absolute; left: calc(50% - 18px); top: 4px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--hot);
  transition: transform .06s linear;
}
.jump {
  width: 76px; height: 76px; border-radius: 50%;
  display: grid; place-items: center;
  background: #11152a; border: 2px solid var(--line);
  font: 700 12px "Press Start 2P", monospace; color: var(--text);
  letter-spacing: .02em;
}
.zone.on .jump { background: var(--hot); border-color: var(--hot); color: #fff; }
@media (orientation: landscape) and (max-height: 520px) {
  #pad { display: none; }
}
</style>

<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="pad">
    <div class="zone" id="zl">
      <div class="track"><div class="thumb" id="thumb"></div></div>
      <p>Slide to run. Swipe up to jump.</p>
    </div>
    <div class="zone" id="zr">
      <div class="jump">JUMP</div>
      <p>Tap to hop, hold to fly higher</p>
    </div>
  </div>
</div>

<script>
(() => {
  const T = 16, W = 230, H = 18;
  let VW = 20, VH = 14, LW = VW * T, LH = VH * T;
  const GRAV = 55, JUMP_V = -21, RUN = 11, ACC = 80, FRIC = 40, MAXFALL = 40;
  const STEP = 1 / 60;
  const SOLID = '#=?uP';

  const cv = document.getElementById('c');
  cv.width = LW; cv.height = LH;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const app = document.getElementById('app');
  const stage = document.getElementById('stage');
  const zl = document.getElementById('zl'), zr = document.getElementById('zr');
  const thumb = document.getElementById('thumb');

  const FONT = '"Press Start 2P", monospace';
  try { document.fonts.load('8px "Press Start 2P"'); } catch (_) {}

  /* ---------- level (same layout as the terminal version) ---------- */
  function build() {
    const g = Array.from({ length: H }, () => Array(W).fill(' '));
    const put = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c; };
    const pits = [[40, 43], [76, 80], [119, 123], [161, 165]];
    for (let x = 0; x < W; x++) {
      if (pits.some(([a, b]) => x >= a && x < b)) continue;
      put(x, 16, '#'); put(x, 17, '#');
    }
    [18, 22, 24].forEach(x => put(x, 12, '?'));
    [21, 23, 25].forEach(x => put(x, 12, '='));
    for (let x = 52; x < 60; x++) put(x, 12, x % 3 ? '=' : '?');
    for (let x = 64; x < 69; x++) put(x, 9, '=');
    put(66, 9, '?');
    for (let x = 95; x < 102; x++) put(x, 12, x !== 98 ? '=' : '?');
    for (let x = 130; x < 138; x++) put(x, 12, x % 2 ? '?' : '=');
    for (let x = 140; x < 146; x++) put(x, 9, '=');
    [[32, 2], [48, 3], [88, 2], [108, 3], [150, 3], [172, 2]].forEach(([px, ph]) => {
      for (let dy = 0; dy < ph; dy++) { put(px, 15 - dy, 'P'); put(px + 1, 15 - dy, 'P'); }
    });
    for (let x = 26; x < 31; x++) put(x, 13, 'o');
    for (let x = 65; x < 68; x++) put(x, 7, 'o');
    for (let x = 53; x < 58; x++) put(x, 10, 'o');
    for (let x = 141; x < 145; x++) put(x, 7, 'o');
    [41, 42, 77, 78, 79, 120, 121, 122, 162, 163, 164].forEach(x => put(x, 12, 'o'));
    for (let i = 0; i < 8; i++) for (let dy = 0; dy <= i; dy++) put(190 + i, 15 - dy, '=');
    for (let dy = 0; dy < 11; dy++) put(212, 15 - dy, '|');
    put(212, 4, 'F');
    return g;
  }
  const ENEMY_X = [34, 56, 70, 84, 98, 112, 126, 134, 148, 156, 168, 180, 184];

  /* ---------- state ---------- */
  let grid, player, enemies, fx, camX, camY, timeLeft;
  let state = 'title', stateT = 0, clock = 0;
  let score = 0, coins = 0, lives = 3, hi = 0;
  try { hi = +localStorage.getItem('pp-hi') || 0; } catch (_) {}
  let moveDir = 0, keyDir = 0, thumbDX = 0;
  const held = { touch: 0, key: false, pulse: false };
  let jumpBuf = 0, coyote = 0;

  class E {
    constructor(x, y) { this.x = x; this.y = y; this.w = .8; this.h = 1; this.vx = 0; this.vy = 0; this.g = false; this.alive = true; this.dead = 0; }
  }

  function resetLevel() {
    grid = build();
    player = new E(3, 14); player.face = 1;
    enemies = ENEMY_X.map(x => { const e = new E(x, 15); e.vx = -3; return e; });
    fx = [];
    camX = 0; camY = H - VH;
    timeLeft = 300;
    jumpBuf = 0; coyote = 0;
  }
  function newGame() { score = 0; coins = 0; lives = 3; resetLevel(); state = 'play'; }

  /* ---------- physics ---------- */
  const solid = (c, r) => {
    if (c < 0 || c >= W) return true;
    if (r < 0 || r >= H) return false;
    return SOLID.includes(grid[r][c]);
  };
  const rowsSolid = (c, a, b) => { for (let r = a; r <= b; r++) if (solid(c, r)) return true; return false; };
  const colsSolid = (r, a, b) => { for (let c = a; c <= b; c++) if (solid(c, r)) return true; return false; };

  function bump(c, r) {
    if (c < 0 || c >= W || r < 0 || r >= H) return;
    if (grid[r][c] === '?') {
      grid[r][c] = 'u'; coins++; score += 200; sfx('coin');
      fx.push({ x: c + .5, y: r - .2, vy: -9, life: .6, txt: '+200' });
    }
    if (r > 0 && grid[r - 1][c] === 'o') {
      grid[r - 1][c] = ' '; coins++; score += 100; sfx('coin');
    }
  }

  function move(e, dt, isP) {
    e.x += e.vx * dt;
    const top = Math.floor(e.y + .05), bot = Math.floor(e.y + e.h - .05);
    if (e.vx > 0) {
      const c = Math.floor(e.x + e.w);
      if (rowsSolid(c, top, bot)) { e.x = c - e.w - .001; e.vx = isP ? 0 : -e.vx; }
    } else if (e.vx < 0) {
      const c = Math.floor(e.x);
      if (e.x < 0 || rowsSolid(c, top, bot)) { e.x = e.x >= 0 ? c + 1.001 : 0; e.vx = isP ? 0 : -e.vx; }
    }
    e.vy = Math.min(e.vy + GRAV * dt, MAXFALL);
    e.y += e.vy * dt;
    e.g = false;
    const lc = Math.floor(e.x + .05), rc = Math.floor(e.x + e.w - .05);
    if (e.vy > 0) {
      const r = Math.floor(e.y + e.h);
      if (colsSolid(r, lc, rc)) { e.y = r - e.h; e.vy = 0; e.g = true; }
    } else if (e.vy < 0) {
      const r = Math.floor(e.y);
      if (colsSolid(r, lc, rc)) { if (isP) bump(Math.floor(e.x + e.w / 2), r); e.y = r + 1; e.vy = 0; }
    }
  }

  function hurt() {
    lives--; sfx('hurt');
    player.vy = -16; player.vx = 0;
    state = lives <= 0 ? 'over' : 'dead'; stateT = 0;
  }

  function update(dt) {
    clock += dt;
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.y += f.vy * dt; f.vy += 30 * dt; f.life -= dt;
      if (f.life <= 0) fx.splice(i, 1);
    }
    if (state === 'dead' || state === 'over') {
      stateT += dt;
      player.vy += GRAV * dt; player.y += player.vy * dt;
      if (state === 'dead' && stateT > 1.5) { resetLevel(); state = 'play'; }
      return;
    }
    if (state === 'won') stateT += dt;
    if (state !== 'play') return;

    const p = player;
    timeLeft -= dt;
    if (timeLeft <= 0) { hurt(); return; }

    const dir = moveDir || keyDir;
    if (dir) {
      p.face = dir;
      const step = ACC * dt, target = dir * RUN;
      p.vx += Math.max(-step, Math.min(step, target - p.vx));
    } else {
      const step = FRIC * dt;
      p.vx = Math.abs(p.vx) <= step ? 0 : p.vx - Math.sign(p.vx) * step;
    }

    const jumpHeld = held.touch > 0 || held.key || held.pulse;
    jumpBuf = Math.max(0, jumpBuf - dt);
    coyote = p.g ? .09 : Math.max(0, coyote - dt);
    if (jumpBuf > 0 && coyote > 0) { p.vy = JUMP_V; jumpBuf = 0; coyote = 0; sfx('jump'); }
    if (!jumpHeld && p.vy < -7) p.vy = -7;

    move(p, dt, true);

    const x0 = Math.floor(p.x), x1 = Math.floor(p.x + p.w), y0 = Math.floor(p.y), y1 = Math.floor(p.y + p.h);
    for (let r = y0; r <= y1; r++) for (let c = x0; c <= x1; c++) {
      if (r >= 0 && r < H && c >= 0 && c < W && grid[r][c] === 'o') {
        grid[r][c] = ' '; coins++; score += 100; sfx('coin');
      }
    }

    for (const e of enemies) {
      if (e.dead > 0) { e.dead -= dt; continue; }
      if (!e.alive || Math.abs(e.x - p.x) > 24) continue;
      move(e, dt, false);
      if (e.y > H + 2) { e.alive = false; continue; }
      if (Math.abs(e.x - p.x) < .85 && Math.abs(e.y - p.y) < .9) {
        if (p.vy > 0 && p.y + p.h < e.y + .75) {
          e.alive = false; e.dead = .35;
          p.vy = (held.touch > 0 || held.key || held.pulse) ? -19 : -12;
          score += 300; sfx('stomp');
          fx.push({ x: e.x + .4, y: e.y, vy: -6, life: .6, txt: '+300' });
        } else { hurt(); return; }
      }
    }

    if (p.y > H + 2) { hurt(); return; }
    if (p.x >= 211.5) {
      score += Math.floor(timeLeft) * 10; sfx('win');
      state = 'won'; stateT = 0; saveHi(); return;
    }
    const tx = Math.max(0, Math.min(W - VW, p.x - VW * .4));
    camX += (tx - camX) * .2;
    const ty = Math.max(0, Math.min(H - VH, p.y - 8));
    camY += (Math.max(H - VH - 3.5, ty) - camY) * .12;
    camY = Math.max(0, Math.min(H - VH, camY));
  }
  function saveHi() {
    if (score > hi) { hi = score; try { localStorage.setItem('pp-hi', String(hi)); } catch (_) {} }
  }

  /* ---------- audio ---------- */
  let ac = null;
  function audioInit() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  }
  function sfx(k) {
    if (k === 'jump') tone(300, 700, .16, 'square', .05);
    else if (k === 'coin') { tone(988, 988, .07, 'square', .05); tone(1319, 1319, .2, 'square', .05, .07); }
    else if (k === 'stomp') tone(240, 70, .12, 'square', .07);
    else if (k === 'hurt') tone(400, 60, .5, 'sawtooth', .06);
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .18, 'square', .05, i * .12));
  }

  /* ---------- drawing ---------- */
  function skyFill() {
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#5aa9f0'); g.addColorStop(1, '#bfe4ff');
    return g;
  }

  function cloud(x, y) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y + 6, 30, 8);
    ctx.fillRect(x + 12, y, 16, 8);
    ctx.fillRect(x, y + 9, 42, 5);
  }
  function hill(x, base, w, h, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x, base, w, h, 0, Math.PI, 0); ctx.fill();
  }
  function txt(s, x, y, size, col, align) {
    ctx.font = size + 'px ' + FONT;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
    ctx.fillStyle = col; ctx.fillText(s, x, y);
  }

  function drawTile(ch, c, r, px, py) {
    if (ch === '#') {
      ctx.fillStyle = '#a65a28'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#8a4519'; ctx.fillRect(px + 3, py + 8, 3, 2); ctx.fillRect(px + 10, py + 12, 3, 2);
      if (r === 16) { ctx.fillStyle = '#3fae49'; ctx.fillRect(px, py, T, 4); ctx.fillStyle = '#2f8f3a'; ctx.fillRect(px, py + 4, T, 1); }
    } else if (ch === '=') {
      ctx.fillStyle = '#c4572b'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#6e2810';
      ctx.fillRect(px, py + 7, T, 1); ctx.fillRect(px, py + 15, T, 1);
      ctx.fillRect(px + 7, py, 1, 7); ctx.fillRect(px + 3, py + 8, 1, 7); ctx.fillRect(px + 11, py + 8, 1, 7);
    } else if (ch === '?') {
      ctx.fillStyle = '#f3b52f'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#8a5a00'; ctx.fillRect(px, py, T, 1); ctx.fillRect(px, py + 15, T, 1); ctx.fillRect(px, py, 1, T); ctx.fillRect(px + 15, py, 1, T);
      ctx.fillStyle = '#fff4c2'; ctx.fillRect(px + 2, py + 2, 2, 2); ctx.fillRect(px + 12, py + 2, 2, 2);
      txt('?', px + 4, py + 4, 8, '#7a4a00');
    } else if (ch === 'u') {
      ctx.fillStyle = '#8c7a5a'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#5e4f36'; ctx.fillRect(px, py, T, 1); ctx.fillRect(px, py + 15, T, 1);
      ctx.fillRect(px + 3, py + 3, 2, 2); ctx.fillRect(px + 11, py + 3, 2, 2);
    } else if (ch === 'P') {
      const capTop = !(r > 0 && grid[r - 1][c] === 'P');
      ctx.fillStyle = '#2e9e44'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#6fd884'; ctx.fillRect(px + 3, py, 3, T);
      ctx.fillStyle = '#17692a'; ctx.fillRect(px + T - 3, py, 3, T);
      if (capTop) { ctx.fillStyle = '#17692a'; ctx.fillRect(px, py, T, 1); ctx.fillStyle = '#4cc263'; ctx.fillRect(px, py + 1, T, 3); }
      const left = !(c > 0 && grid[r][c - 1] === 'P');
      if (left) { ctx.fillStyle = '#17692a'; ctx.fillRect(px, py, 1, T); }
    } else if (ch === 'o') {
      const w = Math.abs(Math.cos(clock * 5 + c)) * 6 + 1;
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(px + 8 - w / 2, py + 3, w, 10);
      ctx.fillStyle = '#b8860b'; ctx.fillRect(px + 8 - w / 2, py + 3, 1, 10);
    } else if (ch === '|') {
      ctx.fillStyle = '#e6e6e6'; ctx.fillRect(px + 7, py, 2, T);
    } else if (ch === 'F') {
      ctx.fillStyle = '#e6e6e6'; ctx.fillRect(px + 7, py, 2, T);
      ctx.fillStyle = '#2fbf5a'; ctx.beginPath(); ctx.moveTo(px + 7, py + 1); ctx.lineTo(px - 9, py + 6); ctx.lineTo(px + 7, py + 11); ctx.fill();
    }
  }

  function drawGoomba(x, y, flat) {
    if (flat) { ctx.fillStyle = '#8a4a1f'; ctx.fillRect(x, y + 12, 13, 4); return; }
    const k = Math.floor(clock * 8) % 2;
    ctx.fillStyle = '#9a5424';
    ctx.fillRect(x + 1, y + 2, 11, 8); ctx.fillRect(x + 3, y, 7, 3);
    ctx.fillStyle = '#e8c9a0'; ctx.fillRect(x + 3, y + 9, 7, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 3, y + 4, 3, 3); ctx.fillRect(x + 7, y + 4, 3, 3);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 4, y + 5, 1, 2); ctx.fillRect(x + 8, y + 5, 1, 2);
    ctx.fillStyle = '#3b1d0a'; ctx.fillRect(x + (k ? 0 : 2), y + 13, 5, 3); ctx.fillRect(x + (k ? 8 : 6), y + 13, 5, 3);
  }

  function drawPlayer(x, y) {
    const p = player;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (p.face < 0) { ctx.translate(13, 0); ctx.scale(-1, 1); }
    const run = p.g && Math.abs(p.vx) > 1;
    const ph = Math.floor(clock * 12) % 2;
    const air = !p.g;
    ctx.fillStyle = '#d8281f'; ctx.fillRect(2, 0, 8, 3); ctx.fillRect(2, 2, 11, 2);
    ctx.fillStyle = '#f6c7a0'; ctx.fillRect(2, 4, 9, 4);
    ctx.fillStyle = '#5a2e12'; ctx.fillRect(1, 4, 2, 3); ctx.fillRect(7, 7, 5, 1);
    ctx.fillStyle = '#000'; ctx.fillRect(8, 5, 1, 2);
    ctx.fillStyle = '#d8281f'; ctx.fillRect(1, 8, 11, 3);
    ctx.fillStyle = '#2a4fd0'; ctx.fillRect(3, 9, 7, 4);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(4, 10, 1, 1); ctx.fillRect(8, 10, 1, 1);
    ctx.fillStyle = '#f6c7a0'; ctx.fillRect(air ? 11 : 0, air ? 6 : 9, 2, 2);
    ctx.fillStyle = '#4a2a0f';
    if (air) { ctx.fillRect(0, 13, 5, 3); ctx.fillRect(8, 12, 5, 3); }
    else if (run) { ctx.fillRect(ph ? 0 : 3, 13, 5, 3); ctx.fillRect(ph ? 8 : 6, 13, 5, 3); }
    else { ctx.fillRect(1, 13, 5, 3); ctx.fillRect(7, 13, 5, 3); }
    ctx.restore();
  }

  function panel(lines, extra) {
    ctx.fillStyle = 'rgba(10,12,30,.72)'; ctx.fillRect(0, 0, LW, LH);
    const oy = Math.max(0, Math.round((LH - 224) / 2));
    lines.forEach(([s, size, col, y]) => txt(s, LW / 2, y + oy, size, col, 'center'));
    if (extra) extra();
  }

  function draw() {
    ctx.fillStyle = skyFill(); ctx.fillRect(0, 0, LW, LH);
    const cpx = Math.round(camX * T), cpy = Math.round(camY * T);
    const gy = 16 * T - cpy;
    for (let i = 0; i < 9; i++) {
      let x = i * 150 - cpx * .35; x = ((x % 1350) + 1350) % 1350 - 70;
      cloud(x, 14 + (i * 37) % 46 - cpy * .1);
    }
    for (let i = 0; i < 9; i++) {
      let x = i * 230 - cpx * .6; x = ((x % 2070) + 2070) % 2070 - 90;
      hill(x, gy, 56 + (i % 3) * 14, 30 + (i % 2) * 14, i % 2 ? '#5ec96a' : '#49b556');
    }
    const c0 = Math.floor(camX), c1 = Math.min(W - 1, c0 + VW + 1);
    const r0 = Math.max(0, Math.floor(camY)), r1 = Math.min(H - 1, r0 + VH + 1);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const ch = grid[r][c];
      if (ch !== ' ') drawTile(ch, c, r, c * T - cpx, r * T - cpy);
    }
    for (const e of enemies) {
      if (e.alive || e.dead > 0) {
        const ex = e.x * T - cpx;
        if (ex > -20 && ex < LW + 20) drawGoomba(Math.round(ex), Math.round(e.y * T - cpy), !e.alive);
      }
    }
    drawPlayer(player.x * T - cpx, player.y * T - cpy);
    for (const f of fx) txt(f.txt, f.x * T - cpx, f.y * T - cpy, 6, '#fff', 'center');

    // HUD
    txt('SCORE ' + String(score).padStart(6, '0'), 6, 5, 7, '#fff');
    txt('x' + String(coins).padStart(2, '0'), 106, 5, 7, '#ffd23f');
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(98, 5, 5, 7);
    txt('T' + String(Math.max(0, Math.ceil(timeLeft))).padStart(3, '0'), 140, 5, 7, '#fff');
    txt('LIFE ' + Math.max(0, lives), 200, 5, 7, '#fff');

    if (state === 'title') {
      panel([
        ['POCKET', 18, '#ff6a3d', 40], ['PLUMBER', 18, '#ff6a3d', 64],
        ['LEFT THUMB: SLIDE TO RUN', 7, '#fff', 112],
        ['RIGHT THUMB: TAP TO JUMP', 7, '#fff', 128],
        ['STOMP THE BROWN GUYS', 7, '#ffd23f', 150],
        [(Math.floor(clock * 2) % 2 ? '' : 'TAP TO START'), 9, '#fff', 184],
        [hi ? 'BEST ' + String(hi).padStart(6, '0') : '', 7, '#8c95c2', 204],
      ]);
    } else if (state === 'dead') {
      panel([['OUCH!', 14, '#fff', 88], ['LIVES LEFT ' + lives, 8, '#ffd23f', 116]]);
      drawPlayer(player.x * T - cpx, player.y * T - cpy);
    } else if (state === 'over') {
      panel([['GAME OVER', 14, '#ff6a3d', 76], ['SCORE ' + score, 8, '#fff', 110],
             [stateT > .8 ? 'TAP TO TRY AGAIN' : '', 8, '#ffd23f', 150]]);
    } else if (state === 'won') {
      panel([['COURSE CLEAR!', 12, '#ffd23f', 70], ['SCORE ' + score, 9, '#fff', 104],
             [score >= hi ? 'NEW BEST!' : 'BEST ' + hi, 8, '#ff6a3d', 126],
             [stateT > .8 ? 'TAP TO PLAY AGAIN' : '', 8, '#fff', 164]]);
    }
  }

  /* ---------- input ---------- */
  const jumpDown = () => { jumpBuf = .12; };
  function tapAction() {
    if (state === 'title') newGame();
    else if ((state === 'over' || state === 'won') && stateT > .8) newGame();
  }
  const ptrs = new Map();
  function ui() {
    zl.classList.toggle('on', moveDir !== 0 || [...ptrs.values()].some(p => p.role === 'move'));
    zr.classList.toggle('on', held.touch > 0 || held.pulse);
    thumb.style.transform = 'translateX(' + Math.round(thumbDX * 1.1) + 'px)';
  }
  app.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit();
    if (state !== 'play') { tapAction(); return; }
    const r = app.getBoundingClientRect();
    if (e.clientX - r.left < r.width / 2) ptrs.set(e.pointerId, { role: 'move', sx: e.clientX, sy: e.clientY, fired: false });
    else { ptrs.set(e.pointerId, { role: 'jump' }); held.touch++; jumpDown(); }
    try { app.setPointerCapture(e.pointerId); } catch (_) {}
    ui();
  });
  app.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p || p.role !== 'move') return;
    let dx = e.clientX - p.sx; const dy = e.clientY - p.sy;
    if (dx > 40) { p.sx = e.clientX - 40; dx = 40; } else if (dx < -40) { p.sx = e.clientX + 40; dx = -40; }
    moveDir = dx > 9 ? 1 : dx < -9 ? -1 : 0;
    thumbDX = dx;
    if (dy < -40 && !p.fired) {
      p.fired = true; jumpDown(); held.pulse = true; setTimeout(() => { held.pulse = false; ui(); }, 240);
    } else if (dy > -15) p.fired = false;
    ui();
  });
  function release(e) {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    ptrs.delete(e.pointerId);
    if (p.role === 'move') { moveDir = 0; thumbDX = 0; }
    else held.touch = Math.max(0, held.touch - 1);
    ui();
  }
  app.addEventListener('pointerup', release);
  app.addEventListener('pointercancel', release);
  document.addEventListener('contextmenu', e => e.preventDefault());

  const KEYS = {
    ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1,
  };
  const JK = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];
  const keyHeld = new Set();
  addEventListener('keydown', e => {
    audioInit();
    if (e.code in KEYS) { keyHeld.add(e.code); keyDir = KEYS[e.code]; e.preventDefault(); }
    if (JK.includes(e.code)) {
      e.preventDefault();
      if (state !== 'play') { tapAction(); return; }
      if (!e.repeat) jumpDown();
      held.key = true;
    }
    if (e.code === 'Enter') tapAction();
  });
  addEventListener('keyup', e => {
    if (e.code in KEYS) {
      keyHeld.delete(e.code);
      const left = [...keyHeld].pop();
      keyDir = left ? KEYS[left] : 0;
    }
    if (JK.includes(e.code)) held.key = false;
  });
  addEventListener('blur', () => { keyHeld.clear(); keyDir = 0; held.key = false; });

  /* ---------- sizing + loop ---------- */
  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    const a = w / h;
    const nh = Math.max(14, Math.min(18, Math.round(16 / a)));
    const nw = Math.max(16, Math.min(28, Math.round(nh * a)));
    if (nw !== VW || nh !== VH) {
      VW = nw; VH = nh; LW = VW * T; LH = VH * T;
      cv.width = LW; cv.height = LH; ctx.imageSmoothingEnabled = false;
    }
    const s = Math.max(.5, Math.min(w / LW, h / LH));
    cv.style.width = Math.floor(LW * s) + 'px';
    cv.style.height = Math.floor(LH * s) + 'px';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 150));
  new ResizeObserver(fit).observe(stage);

  resetLevel(); fit();
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
